services:
  app:
    build: .
    # --no-reload: sin el, `artisan serve` ignora PHP_CLI_SERVER_WORKERS y atiende
    # de a un request. El simulador de WhatsApp se llama a si mismo para mandar el
    # webhook firmado, y con un solo worker eso se traba. Costo: un cambio en el
    # .env pide `docker compose restart app` (el codigo ya lo pedia por opcache).
    command: php artisan serve --host=0.0.0.0 --port=8000 --no-reload
    environment:
      PHP_CLI_SERVER_WORKERS: 4
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # El worker existe desde el dia 1: RF-A2 exige que el webhook responda 200
  # antes de procesar, y sin worker la cola se llena y nada avanza.
  worker:
    build: .
    command: php artisan queue:work --tries=3 --backoff=5
    volumes:
      - .:/var/www/html
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

  # E2E con Playwright (`e2e/`). No arranca con `up`: se corre a demanda con
  #   docker compose --profile e2e run --rm e2e
  # Necesita app y worker levantados y el simulador encendido (META_SIMULADOR,
  # META_GRAPH_URL y GOOGLE_API_URL apuntando a los mocks; ver .env.example).
  e2e:
    image: mcr.microsoft.com/playwright:v1.49.1-noble
    profiles: [e2e]
    working_dir: /e2e
    user: "${E2E_UID:-1000}:${E2E_GID:-1000}"
    environment:
      HOME: /tmp
      BASE_URL: http://app:8000
      CI: ${CI:-}
      CAPTURAS: ${CAPTURAS:-}
    volumes:
      - ./e2e:/e2e
    command: sh -c "npm install --no-audit --no-fund && npx playwright test"
    depends_on:
      app:
        condition: service_started

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: agendallena
      MYSQL_USER: agendallena
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Crea `agendallena_testing` al inicializar el volumen. Los tests corren
      # contra el mismo motor que produccion, no contra SQLite.
      # Solo se ejecuta con el volumen vacio; sobre uno existente hay que
      # aplicarlo a mano (ver el encabezado del .sql).
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
  redis-data:

# /etc/nginx/sites-available/agendallenaia.atiende.lat
# Mismo esquema que avisos.atiende.lat: HTTPS con el certificado comodín.
#
# Nombre exacto: en nginx le gana a la regex ~^(?<tenant>...)\.atiende\.lat$
# que manda los subdominios de atiende al puerto 81.

server {
    # `http2` en el listen: compatible con el nginx 1.24 de Ubuntu.
    listen 443 ssl http2;
    server_name agendallenaia.atiende.lat;

    ssl_certificate     /etc/nginx/ssl/atiende.lat/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/atiende.lat/key.pem;

    # La app ya corta el webhook en 256 KB; nginx frena antes lo desmedido.
    client_max_body_size 1m;

    location / {
        proxy_pass         http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  443;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name agendallenaia.atiende.lat;
    return 301 https://$host$request_uri;
}
